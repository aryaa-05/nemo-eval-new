[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-evaluator-benchmarking"
version = "1.0.0"
description = "NVIDIA NeMo Evaluator-Based Multi-Model Benchmarking Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0"
]

[project.scripts]
nel = "src.cli.nel:cli"
