# STAND-IN pair 3. Mirrors the ROLE of real pair 3 (reasoning model vs a Qwen model). Not the real models.
# Status of the models: both are VERIFIED on Groq (a real call worked for each). Qwen3.8-27B is a different version and
# size from the Qwen3.5 named in the brief.
job_name: "standin_pair3_pipeline_validation"
description: "PIPELINE VALIDATION ONLY. Stand-in models (free Groq), not the models under study. Not results for Ministral-3-8B-Reasoning or Qwen3.5."
seed: 42
limit_per_benchmark: 15

models:
  - "openai/gpt-oss-20b"
  - "qwen/qwen3.8-27b"

benchmarks:
  - "kyc_india"
  - "rbi_regulations"
  - "image_processing"
  - "mmlu_pro"
  - "gsm8k"
  - "math_500"
  - "gpqa"
  - "humaneval"
  - "truthfulqa"
