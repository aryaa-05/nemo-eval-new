# Free-tier role pair 2. Mirrors the ROLE of pair 2 (mid-size reasoning model vs the nearest Llama to Llama 4 Scout).
# Nemotron-3-Nano reasoning is LIVE on NVIDIA NIM; Llama-3.2-11B is SIMULATED (mock) because a later real call returned HTTP 410.
# The role is only loosely mirrored: Llama 4 Scout is not on the free providers, the 90B Llama timed out once at 120 s
# (inconclusive, not a 404) and the 70B Nemotron fallback returned 404.
job_name: "free_tier_pair2"
description: "LIVE and SIMULATED comparison of free-tier role models; not results for Ministral-3-14B-Reasoning or Llama-4-Scout. Mock-provider runs are SIMULATED."
seed: 42
limit_per_benchmark: 15

models:
  - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
  - "meta/llama-3.2-11b-vision-instruct"

benchmarks:
  - "kyc_india"
  - "rbi_regulations"
  - "image_processing"
  - "mmlu_pro"
  - "gsm8k"
  - "math_500"
  - "gpqa"
  - "humaneval"
  - "truthfulqa"
