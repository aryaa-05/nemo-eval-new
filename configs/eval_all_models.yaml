# All Models Evaluation Configuration
job_name: "all_models_evaluation"
description: "Comprehensive benchmark across all 3 comparison pairs, vision model, and 70B baseline"
seed: 42
limit_per_benchmark: 5

models:
  # Pair 1: Ministral-3-8B vs Llama-3.1-8B
  - "mistralai/ministral-3-8b-instruct-2512"
  - "meta/llama-3.1-8b-instruct"
  # Pair 2: Ministral-3-14B Reasoning vs Llama-4-Scout-17B
  - "mistralai/ministral-3-14b-reasoning-2512"
  - "meta/llama-4-scout-17b-16e-instruct"
  # Pair 3: Ministral-3-8B Reasoning vs Qwen3.5-8B
  - "mistralai/ministral-3-8b-reasoning-2512"
  - "qwen/qwen3.5-8b"
  # Vision Model
  - "meta/llama-3.2-11b-vision-instruct"
  # Baseline Flagship
  - "meta/llama-3.1-70b-instruct"

benchmarks:
  - "mmlu_pro"
  - "gsm8k"
  - "math_500"
  - "gpqa"
  - "humaneval"
  - "truthfulqa"
  - "kyc_india"
  - "rbi_regulations"
  - "image_processing"
  - "custom_byob"

execution:
  concurrency: 4
  timeout_seconds: 30
  retry_attempts: 3
  cache_responses: true
  temperature: 0.1
  max_tokens: 1024
