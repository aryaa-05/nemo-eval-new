# Default Evaluation Job Configuration
job_name: "baseline_multi_model_evaluation"
description: "Comprehensive evaluation across 6 flagship LLMs and 6 standard benchmarks"
seed: 42
limit_per_benchmark: 15  # Number of samples per benchmark (0 for all)

# Models to evaluate
models:
  - "meta/llama-3.1-70b-instruct"
  - "meta/llama-3.1-8b-instruct"
  - "qwen/qwen-2.5-72b-instruct"
  - "mistralai/mixtral-8x7b-instruct"
  - "deepseek/deepseek-r1-distill-llama-70b"
  - "openai/gpt-4o-mini"

# Benchmarks to execute
benchmarks:
  - "mmlu_pro"
  - "gsm8k"
  - "math_500"
  - "gpqa"
  - "humaneval"
  - "truthfulqa"

# Execution parameters
execution:
  concurrency: 4
  timeout_seconds: 30
  retry_attempts: 3
  cache_responses: true
  temperature: 0.1
  max_tokens: 1024

# Quality gate settings (for nel gate)
quality_gate:
  baseline_model: "meta/llama-3.1-8b-instruct"
  candidate_model: "meta/llama-3.1-70b-instruct"
  min_overall_accuracy: 0.65
  max_regression_delta: 0.03
  significance_alpha: 0.05
